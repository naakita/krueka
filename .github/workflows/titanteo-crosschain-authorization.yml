name: Titanteo crosschain official-compiler auth tests
on:
  push:
    branches:
      - research/evm-lab-public-tests
    paths:
      - 'evm-public-lab/0x-hypotheses/TitanteoCrossChainReceiverSecurity.t.sol'
      - '.github/workflows/titanteo-crosschain-authorization.yml'
permissions:
  contents: read
concurrency:
  group: titanteo-crosschain-owner-domain
  cancel-in-progress: true
jobs:
  crosschain-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original pinned Foundry from 0x CI
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
          cache: false
      - name: Clone unmodified pinned 0x sources with submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --recurse-submodules https://github.com/0xProject/0x-settler.git original-0x
          cd original-0x
          git checkout 275cf8ce398bcc862753deee7ff043764c1e27b9
          git submodule update --init --recursive
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          cp ../evm-public-lab/0x-hypotheses/TitanteoCrossChainReceiverSecurity.t.sol test/unit/TitanteoCrossChainReceiverSecurity.t.sol
          echo "USING_ORIGINAL_TEST_FIXTURE_AND_UNMODIFIED_PROTOCOL"
      - name: Build MultiCall using official deterministic CREATE2 compiler flags
        working-directory: original-0x
        timeout-minutes: 6
        shell: bash
        env:
          FOUNDRY_SOLC_VERSION: '0.8.28'
          FOUNDRY_EVM_VERSION: london
          FOUNDRY_OPTIMIZER_RUNS: '1000000'
          FOUNDRY_FFI: 'false'
        run: |
          set -euo pipefail
          forge build -- src/multicall/MultiCall.sol
          test -s out/MultiCall.sol/MultiCall.json
          echo "PINNED_MULTICALL_BYTECODE_BUILT"
      - name: Build factory using official deterministic CREATE2 compiler flags
        working-directory: original-0x
        timeout-minutes: 6
        shell: bash
        env:
          FOUNDRY_SOLC_VERSION: '0.8.34'
          FOUNDRY_EVM_VERSION: london
          FOUNDRY_OPTIMIZER_RUNS: '1000000'
          FOUNDRY_FFI: 'false'
        run: |
          set -euo pipefail
          forge build -- src/CrossChainReceiverFactory.sol
          test -s out/CrossChainReceiverFactory.sol/CrossChainReceiverFactory.json
          echo "PINNED_FACTORY_BYTECODE_BUILT"
      - name: Reproduce official upstream testSingleAction on isolated EVM
        working-directory: original-0x
        timeout-minutes: 6
        shell: bash
        env:
          FOUNDRY_FFI: 'false'
        run: |
          set -euo pipefail
          forge test --skip 'src/*' --skip 'test/integration/*' --skip 'test/0.8.25/*' --match-path 'test/unit/CrossChainReceiverFactory.t.sol' --match-test testSingleAction -vv | tee "$RUNNER_TEMP/upstream-baseline.log"
          grep -F '[PASS] testSingleAction()' "$RUNNER_TEMP/upstream-baseline.log"
          echo "UPSTREAM_CROSSCHAIN_BASELINE_PASSED"
      - name: Execute five independently authored Titanteo security invariants
        working-directory: original-0x
        timeout-minutes: 6
        shell: bash
        env:
          FOUNDRY_FFI: 'false'
        run: |
          set -euo pipefail
          forge test --skip 'src/*' --skip 'test/integration/*' --skip 'test/0.8.25/*' --match-path 'test/unit/TitanteoCrossChainReceiverSecurity.t.sol' --fuzz-runs 256 -v | tee "$RUNNER_TEMP/titanteo-crosschain-checks.log"
          grep -E 'Suite result:|Ran [0-9]+ test suites' "$RUNNER_TEMP/titanteo-crosschain-checks.log"
          echo "TITANTEO_CROSSCHAIN_INVARIANTS_COMPLETED"
