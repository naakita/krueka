name: Titanteo HyperEVM nested SELECT authorization (isolated)
on:
  push:
    branches:
      - research/evm-lab-public-tests
    paths:
      - 'evm-public-lab/0x-hypotheses/TitanteoHyperEvmNestedSelect.t.sol'
      - '.github/workflows/titanteo-hyperevm-nested-select.yml'
permissions:
  contents: read
concurrency:
  group: titanteo-hyperevm-nested-select
  cancel-in-progress: true
jobs:
  isolated-original:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
          cache: false
      - name: Clone pinned original 0x source (no chain RPC)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --recurse-submodules https://github.com/0xProject/0x-settler.git original-0x
          cd original-0x
          git checkout 9a5f9f9ee9f5f056cb9846048b36fa18562b1983
          git submodule update --init --recursive
          cp ../evm-public-lab/0x-hypotheses/TitanteoHyperEvmNestedSelect.t.sol test/unit/TitanteoHyperEvmNestedSelect.t.sol
          echo "ORIGINAL_0X_SHA=$(git rev-parse HEAD)"
      - name: Prepare upstream exact compiler artifacts
        working-directory: original-0x
        timeout-minutes: 10
        env:
          FOUNDRY_FFI: 'false'
        run: |
          set -euo pipefail
          FOUNDRY_SOLC_VERSION=0.8.34 forge build -- src/chains/HyperEvm/TakerSubmitted.sol
          FOUNDRY_SOLC_VERSION=0.8.25 forge build -- src/deployer/Deployer.sol src/allowanceholder/AllowanceHolder.sol
          FOUNDRY_SOLC_VERSION=0.8.26 forge build -- lib/v4-core/src/PoolManager.sol
          FOUNDRY_SOLC_VERSION=0.8.28 FOUNDRY_EVM_VERSION=london FOUNDRY_OPTIMIZER_RUNS=1000000 forge build -- src/multicall/MultiCall.sol
      - name: Baseline original-source HyperEVM nested SELECT tests
        working-directory: original-0x
        timeout-minutes: 8
        env:
          FOUNDRY_FFI: 'false'
          FOUNDRY_GAS_LIMIT: '50000000'
          FOUNDRY_BLOCK_GAS_LIMIT: '50000000'
          FOUNDRY_CODE_SIZE_LIMIT: '200000'
        run: |
          set -euo pipefail
          forge test --skip 'src/*' --skip 'test/integration/*' --skip 'test/0.8.25/*' --match-path 'test/unit/TitanteoHyperEvmNestedSelect.t.sol' -vvv | tee "$RUNNER_TEMP/hyperevm-original.log"
          grep -F '[PASS] testNestedSelectCannotCallHyperCoreWriter()' "$RUNNER_TEMP/hyperevm-original.log"
          grep -F '[PASS] testRejectedCoreWriterTrialThenAllowedPoolCommitsWithoutLeak()' "$RUNNER_TEMP/hyperevm-original.log"
          echo "UPSTREAM_HYPEREVM_NESTED_SELECT_BASELINE_PASSED"
      - name: Mutate guard only in disposable local clone
        working-directory: original-0x
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/chains/HyperEvm/BlockHyperEvmSystemContracts.sol')
          s=p.read_text()
          old='return super._isRestrictedTarget(target).or(target == _HYPEREVM_CORE_WRITER);'
          new='return super._isRestrictedTarget(target); // TITANTEO_SYNTHETIC_CORE_WRITER_BYPASS'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          print('SYNTHETIC_HYPEREVM_CORE_WRITER_GUARD_REMOVED')
          PY
      - name: Negative control must detect synthetic authorization defect
        working-directory: original-0x
        timeout-minutes: 8
        env:
          FOUNDRY_FFI: 'false'
          FOUNDRY_GAS_LIMIT: '50000000'
          FOUNDRY_BLOCK_GAS_LIMIT: '50000000'
          FOUNDRY_CODE_SIZE_LIMIT: '200000'
        run: |
          set +e
          forge test --skip 'src/*' --skip 'test/integration/*' --skip 'test/0.8.25/*' --match-path 'test/unit/TitanteoHyperEvmNestedSelect.t.sol' --match-test 'testNestedSelectCannotCallHyperCoreWriter' -vv > "$RUNNER_TEMP/hyperevm-mutant.log" 2>&1
          rc=$?
          set -e
          tail -45 "$RUNNER_TEMP/hyperevm-mutant.log"
          if [ "$rc" -eq 0 ]; then echo 'ERROR: synthetic defect not detected'; exit 1; fi
          if grep -Eq 'Compiler run failed|Compilation failed|ParserError|TypeError|^Error \([0-9]+\):|vm.getCode: no bytecode' "$RUNNER_TEMP/hyperevm-mutant.log"; then
            echo 'ERROR: fixture/build failure is not evidence'; exit 1
          fi
          grep -F '[FAIL:' "$RUNNER_TEMP/hyperevm-mutant.log"
          grep -Ei 'next call did not revert|call did not revert|expected revert' "$RUNNER_TEMP/hyperevm-mutant.log"
          echo "SYNTHETIC_HYPEREVM_NESTED_AUTH_BYPASS_DETECTED"
