name: Titanteo latest Settler actual ETH and token conservation audit
on:
  push:
    branches:
      - research/evm-lab-public-tests
    paths:
      - 'evm-public-lab/0x-hypotheses/TitanteoSlippageRealMoneyExtension.*'
      - '.github/workflows/titanteo-settler-surplus-latest.yml'
permissions:
  contents: read
concurrency:
  group: titanteo-settler-surplus-latest
  cancel-in-progress: true
jobs:
  original-latest-funds:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
          cache: false
      - name: Pin latest official 0x commit without accessing deployed contracts
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --recurse-submodules https://github.com/0xProject/0x-settler.git target
          cd target
          git checkout 9a5f9f9ee9f5f056cb9846048b36fa18562b1983
          git submodule update --init --recursive
          echo "PINNED_ORIGINAL_2026_10_23=$(git rev-parse HEAD)"
      - name: Inject independent tests into upstream test source only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('target/test/unit/core/PositiveSlippageUnitTest.t.sol')
          c=root.read_text()
          enter='contract PositiveSlippageUnitTest is Test {'
          assert c.count(enter)==1
          helpers=Path('evm-public-lab/0x-hypotheses/TitanteoSlippageRealMoneyExtension.helper.soltxt').read_text()
          tests=Path('evm-public-lab/0x-hypotheses/TitanteoSlippageRealMoneyExtension.tests.soltxt').read_text()
          c=c.replace(enter,helpers+'\n'+enter)
          anchor='    function _executeToken('
          assert c.count(anchor)==1
          c=c.replace(anchor,tests+'\n'+anchor)
          root.write_text(c)
          print('INJECTED_THREE_NEW_LOCAL_INVARIANTS')
          PY
      - name: Install exact Solidity 0.8.34 from verified upstream GitHub release
        shell: bash
        run: |
          set -euo pipefail
          dir="$HOME/.svm/0.8.34"
          mkdir -p "$dir"
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            "https://github.com/argotorg/solidity/releases/download/v0.8.34/solc-static-linux" \
            --output "$dir/solc-0.8.34"
          echo "d40adc6f9fdbb22a97d32a02fa05688bf2ee7886affc48c9851b0afd4a726b39  $dir/solc-0.8.34" | sha256sum -c -
          chmod +x "$dir/solc-0.8.34"
          "$dir/solc-0.8.34" --version
      - name: Match official Osaka CLZ compiler constraints in disposable checkout only
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          changed=[]
          for p in Path("target/src").rglob("*.sol"):
              src=p.read_text()
              if re.search(r"\bclz\s*\(", src) and "pragma solidity ^0.8.25;" in src:
                  assert src.count("pragma solidity ^0.8.25;")==1
                  p.write_text(src.replace("pragma solidity ^0.8.25;", "pragma solidity ^0.8.34;"))
                  changed.append(str(p))
          assert len(changed)>=3,changed
          print("LOCAL_CLZ_COMPATIBILITY_ADJUSTED",changed)
          PY
      - name: Run original and new fund-conservation invariants
        working-directory: target
        timeout-minutes: 11
        shell: bash
        env:
          FOUNDRY_FFI: 'false'
          FOUNDRY_EVM_VERSION: osaka
        run: |
          set -euo pipefail
          forge test --match-path test/unit/core/PositiveSlippageUnitTest.t.sol --fuzz-runs 2048 -v | tee "$RUNNER_TEMP/titanteo-latest-funds.log"
          grep -E 'Suite result:|Ran [0-9]+ test suites' "$RUNNER_TEMP/titanteo-latest-funds.log"
