name: Studio IA - pruebas
on:
  push:
    branches: [main, 'fix/studio-ia-*', 'feat/neon-rift-*']
  pull_request:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check js/club-studio-ai.js
      - run: node supabase/functions/krueka-studio-ai/index.test.cjs
      - run: node tests/studio-client.test.cjs
      - run: node --check js/club-studio-showcase.js
      - run: node tests/studio-neon-rift.test.cjs
