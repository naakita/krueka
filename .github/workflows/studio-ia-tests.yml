name: Studio IA - pruebas
on:
  push:
    branches: [main, 'fix/studio-ia-*', 'feat/neon-rift-*', 'feat/studio-forge-*', 'feat/studio-space-*', 'feat/studio-gestor-heroes-*']
  pull_request:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check js/club-studio-ai.js
      - run: node supabase/functions/krueka-studio-ai/index.test.cjs
      - run: node tests/studio-client.test.cjs
      - run: node --check js/club-studio-showcase.js
      - run: node tests/studio-neon-rift.test.cjs
      - run: node tests/studio-neon-rift-browser.cjs
      - run: node --check js/club-studio-forge.js
      - run: node tests/studio-forge.test.cjs
      - run: node tests/studio-forge-browser.test.cjs
      - run: node --check js/club-studio-missions.js
      - run: node tests/studio-missions.test.cjs
      - run: node tests/studio-missions-browser.test.cjs
      - run: node --check js/club-studio-heroes.js
      - run: node tests/studio-heroes.test.cjs
      - run: node tests/studio-heroes-browser.test.cjs
      - run: node tests/studio-heroes-editor-browser.test.cjs
      - run: node --check js/club-studio-game-builder.js
      - run: node tests/studio-game-builder.test.cjs
