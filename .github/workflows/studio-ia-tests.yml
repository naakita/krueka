name: Studio IA - pruebas
on:
  push:
    branches: [main, 'fix/studio-ia-*', 'feat/neon-rift-*', 'feat/studio-forge-*', 'feat/studio-space-*', 'feat/studio-gestor-heroes-*', 'feat/studio-rpg-builder-*', 'feat/hero-render-pro-*', 'fix/hero-renderpro-access-*', 'feat/studio-alternative-chat-*', 'feat/studio-chat-individual-focus-*', 'feat/hero-3d-to-protagonist-*', 'feat/word-public-submissions-*', 'feat/word-teacher-email-access-*', 'fix/word-teacher-captcha-*', 'feat/excel-grade-dropboxes-*', 'feat/siwc-krueka-readiness-*', 'feat/educational-ai-brand-refresh-*', 'feat/krueka-light-futurist-canva-inspired-*', 'feat/hero-centered-webgl-ai-*', 'fix/replace-unprofessional-hero-*', 'feat/krueka-product-first-*', 'feat/krueka-premium-platform-*', 'feat/temporary-class-activities-*', 'fix/institutional-*']
  pull_request:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check js/decisions.js
      - run: node --test tests/decisions.test.cjs
      - run: node --check js/club-studio-ai.js
      - run: node supabase/functions/krueka-studio-ai/index.test.cjs
      - run: node tests/studio-client.test.cjs
      - run: node --check js/club-studio-access.js
      - run: node --check js/club-studio-classroom.js
      - run: node tests/studio-classroom.test.cjs
      - run: node tests/studio-classroom-browser.test.cjs
      - run: node --check js/club-studio-media.js
      - run: node --check js/club-studio-media-editor.js
      - run: node --check js/club-studio-creative.js
      - run: node --check js/club-studio-academy.js
      - run: node --check js/club-studio-3d.js
      - run: node --check js/club-studio-3d-toolbox.js
      - run: node --check js/club-studio-odyssey.js
      - run: node tests/studio-odyssey.test.cjs
      - run: node tests/studio-odyssey-browser.test.cjs
      - run: node tests/studio-3d-toolbox.test.cjs
      - run: node tests/studio-academy.test.cjs
      - run: node --test tests/academia-ia.test.cjs
      - run: node tests/studio-creative.test.cjs
      - run: node tests/studio-creative-browser.test.cjs
      - run: node --check js/club-studio-showcase.js
      - run: node tests/studio-neon-rift.test.cjs
      - run: node tests/studio-neon-rift-browser.cjs
      - run: node --check js/club-studio-forge.js
      - run: node tests/studio-forge.test.cjs
      - run: node tests/studio-forge-browser.test.cjs
      - run: node --check js/club-studio-missions.js
      - run: node tests/studio-missions.test.cjs
      - run: node tests/studio-missions-browser.test.cjs
      - run: node --check js/club-studio-heroes.js
      - run: node tests/studio-heroes.test.cjs
      - run: node tests/studio-heroes-browser.test.cjs
      - run: node tests/studio-heroes-editor-browser.test.cjs
      - run: node --check js/club-studio-game-builder.js
      - run: node tests/studio-game-builder.test.cjs
      - run: node --check js/club-studio-render-pro.js
      - run: node tests/studio-render-pro.test.cjs
      - run: node tests/studio-render-pro-browser.test.cjs
      - run: node --check js/club-studio-alt-help.js
      - run: node tests/studio-alternative-chat.test.cjs
      - run: node tests/studio-alternative-chat-browser.test.cjs
      - run: node --check js/club-studio-focus-chat.js
      - run: node tests/studio-focus-chat.test.cjs
      - run: node tests/studio-focus-chat-browser.test.cjs
      - run: node tests/studio-protagonist.test.cjs
      - run: node tests/studio-protagonist-browser.test.cjs
      - run: node tests/word-dropbox.test.cjs
      - run: node tests/excel-grade-dropboxes.test.cjs
      - run: node tests/siwc-krueka-readiness.test.cjs
      - run: node --check js/krueka-platform-2026.js
      - run: node --check js/krueka-hero-showcase.js
      - run: node --check js/krueka-hero-3d.js
      - run: node tests/krueka-public-redesign.test.cjs
      - run: node tests/krueka-public-redesign-browser.test.cjs
      - run: node --check js/club-gestion.js
      - run: node --check js/asistencia-grado.js
      - run: node tests/asistencia-grado.test.cjs
      - run: node --check js/aula-control.js
      - run: node tests/aula-office-state.test.cjs
      - run: node tests/aula-office-offline.test.cjs
      - run: pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("windows/Diagnosticar-Office-Krueka.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
      - run: node tests/aula-brave-protection.test.cjs
      - run: node tests/aula-windows-sessions.test.cjs
      - run: pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("windows/Blindar-Sesiones-Krueka.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
      - run: pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("windows/Bloquear-Brave-Krueka.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
      - run: node --check js/krueka-clase-temporal.js
      - run: node tests/krueka-live-class.test.cjs
      - run: node tests/krueka-live-class-browser.test.cjs
