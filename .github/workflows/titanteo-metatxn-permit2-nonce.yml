name: Titanteo 0x Permit2 metaTx nonce and witness (isolated)
on:
  push:
    branches:
      - research/evm-lab-public-tests
    paths:
      - 'evm-public-lab/0x-hypotheses/TitanteoMetaTxnPermit2Nonce.t.sol'
      - '.github/workflows/titanteo-metatxn-permit2-nonce.yml'
permissions:
  contents: read
concurrency:
  group: titanteo-metatxn-permit2-nonce
  cancel-in-progress: true
jobs:
  local-permit2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
          cache: false
      - name: Clone unmodified 0x and pinned Permit2 submodule (no RPC)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --recurse-submodules https://github.com/0xProject/0x-settler.git original-0x
          cd original-0x
          git checkout 9a5f9f9ee9f5f056cb9846048b36fa18562b1983
          git submodule update --init --recursive
          test "$(git -C lib/permit2 rev-parse HEAD)" = "cc56ad0f3439c502c246fc5cfcc3db92bb8b7219"
          cp ../evm-public-lab/0x-hypotheses/TitanteoMetaTxnPermit2Nonce.t.sol test/unit/TitanteoMetaTxnPermit2Nonce.t.sol
          echo "UPSTREAM_0X_SHA=$(git rev-parse HEAD)"
          echo "UPSTREAM_PERMIT2_SHA=$(git -C lib/permit2 rev-parse HEAD)"
      - name: Compile real Permit2 and official upstream dependencies
        working-directory: original-0x
        timeout-minutes: 11
        shell: bash
        env:
          FOUNDRY_FFI: 'false'
        run: |
          set -euo pipefail
          FOUNDRY_SOLC_VERSION=0.8.17 FOUNDRY_EVM_VERSION=london forge build -- lib/permit2/src/Permit2.sol
          test -s out/Permit2.sol/Permit2.json
          FOUNDRY_SOLC_VERSION=0.8.34 forge build -- src/chains/Mainnet/MetaTxn.sol
          FOUNDRY_SOLC_VERSION=0.8.25 forge build -- src/deployer/Deployer.sol src/allowanceholder/AllowanceHolder.sol
          FOUNDRY_SOLC_VERSION=0.8.26 forge build -- lib/v4-core/src/PoolManager.sol
          FOUNDRY_SOLC_VERSION=0.8.28 FOUNDRY_EVM_VERSION=london FOUNDRY_OPTIMIZER_RUNS=1000000 forge build -- src/multicall/MultiCall.sol
          echo "REAL_PERMIT2_ARTIFACT_AND_UPSTREAM_COMPILERS_READY"
      - name: Test real nonce and witness boundaries in ephemeral EVM
        working-directory: original-0x
        timeout-minutes: 8
        shell: bash
        env:
          FOUNDRY_FFI: 'false'
          FOUNDRY_GAS_LIMIT: '50000000'
          FOUNDRY_BLOCK_GAS_LIMIT: '50000000'
          FOUNDRY_CODE_SIZE_LIMIT: '200000'
        run: |
          set -euo pipefail
          forge test --skip 'src/*' --skip 'test/integration/*' --skip 'test/0.8.25/*' --match-path 'test/unit/TitanteoMetaTxnPermit2Nonce.t.sol' --fuzz-runs 64 -vvvv | tee "$RUNNER_TEMP/permit2-original.log"
          grep -F '[PASS] testValidSignatureConsumesNonceAndCannotReplay()' "$RUNNER_TEMP/permit2-original.log"
          grep -F '[PASS] testChangedSlippageRecipientRejectedBeforeNonceUse()' "$RUNNER_TEMP/permit2-original.log"
          grep -F '[PASS] testDifferentSettlerContractCannotReuseSignature()' "$RUNNER_TEMP/permit2-original.log"
          grep -F '[PASS] testDifferentSignerCannotUseSignature()' "$RUNNER_TEMP/permit2-original.log"
          grep -F '[PASS] testFailedFinalSlippageRollsBackPermit2Nonce()' "$RUNNER_TEMP/permit2-original.log"
          grep -F '[PASS] testChangedChainIdCannotReplaySignature()' "$RUNNER_TEMP/permit2-original.log"
          grep -F '[PASS] testFuzz_ChangedActionsCannotReuseWitness' "$RUNNER_TEMP/permit2-original.log"
          grep -F '[PASS] testFuzz_ChangedPermitNonceCannotReuseSignature' "$RUNNER_TEMP/permit2-original.log"
          echo "UPSTREAM_PERMIT2_NONCE_WITNESS_BASELINE_PASSED"
      - name: Introduce nonce replay bug only in disposable Permit2 clone
        working-directory: original-0x
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/permit2/src/SignatureTransfer.sol')
          s = p.read_text()
          old = 'if (flipped & bit == 0) revert InvalidNonce();'
          new = 'if (false) revert InvalidNonce(); // TITANTEO_SYNTHETIC_NONCE_REPLAY'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          print('SYNTHETIC_PERMIT2_NONCE_GUARD_DISABLED')
          PY
          FOUNDRY_SOLC_VERSION=0.8.17 FOUNDRY_EVM_VERSION=london FOUNDRY_FFI=false forge build --force -- lib/permit2/src/Permit2.sol
      - name: Negative control must detect synthetic nonce replay
        working-directory: original-0x
        timeout-minutes: 7
        shell: bash
        env:
          FOUNDRY_FFI: 'false'
        run: |
          set +e
          forge test --skip 'src/*' --skip 'test/integration/*' --skip 'test/0.8.25/*' --match-path 'test/unit/TitanteoMetaTxnPermit2Nonce.t.sol' --match-test 'testValidSignatureConsumesNonceAndCannotReplay' -vv > "$RUNNER_TEMP/permit2-mutant.log" 2>&1
          rc=$?
          set -e
          tail -55 "$RUNNER_TEMP/permit2-mutant.log"
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: deliberate nonce replay defect not detected"
            exit 1
          fi
          if grep -Eq 'Compiler run failed|Compilation failed|ParserError|TypeError|^Error \([0-9]+\):|vm.getCode: no bytecode' "$RUNNER_TEMP/permit2-mutant.log"; then
            echo "ERROR: fixture/build failure is not a valid negative control"
            exit 1
          fi
          grep -F '[FAIL:' "$RUNNER_TEMP/permit2-mutant.log"
          grep -Ei 'next call did not revert|call did not revert|expected revert|nonce not consumed' "$RUNNER_TEMP/permit2-mutant.log"
          echo "SYNTHETIC_PERMIT2_NONCE_REPLAY_DETECTED"
