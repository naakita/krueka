name: Verificar sincronizador Windows de aula
on:
  pull_request:
    paths:
      - 'windows/Krueka-PolicySync.ps1'
      - 'tests/aula-policy-sync-runtime.ps1'
      - '.github/workflows/aula-policy-sync-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'windows/Krueka-PolicySync.ps1'
      - 'tests/aula-policy-sync-runtime.ps1'
      - '.github/workflows/aula-policy-sync-runtime.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validar funciones PowerShell con dominios Code.org
        run: pwsh -NoProfile -File tests/aula-policy-sync-runtime.ps1
