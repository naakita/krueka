*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}.note{color:var(--tx2);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}.row{display:flex;gap:12px;flex-wrap:wrap}label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px;font-weight:700}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}textarea{min-height:80px;resize:vertical}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:750;cursor:pointer}.btn.sec{background:var(--soft);color:var(--tx);border:1px solid var(--line)}.btn.sm{padding:6px 11px;font-size:13px}.btn.dan{background:var(--red)}.btn.ok{background:var(--green)}.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800}.tag.blue{background:var(--blue-bg);color:var(--blue)}.tag.green{background:var(--green-bg);color:var(--green)}.tag.red{background:var(--red-bg);color:var(--red)}.alert{padding:10px 12px;border-radius:10px;font-size:13px;margin:10px 0}.alert.err{background:var(--red-bg);color:var(--red)}.alert.ok{background:var(--green-bg);color:var(--green)}.spinner{padding:24px;text-align:center;color:var(--tx2)}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
</style>
