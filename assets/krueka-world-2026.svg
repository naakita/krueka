<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Mundo creativo de Krueka</title><desc id="desc">Ilustración original de un mundo 3D futurista, con plataformas celestes, personaje naranja, estrellas y piezas de construcción.</desc>
<defs>
 <linearGradient id="base" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e5f9ff"/><stop offset="1" stop-color="#e5e4ff"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#73dffb"/><stop offset="1" stop-color="#5b91eb"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#477fe1"/><stop offset="1" stop-color="#1e52ac"/></linearGradient>
 <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4faff"/><stop offset="1" stop-color="#73d9ff"/></linearGradient>
 <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd7a9"/><stop offset="1" stop-color="#ff956d"/></linearGradient>
 <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9cdff"/><stop offset="1" stop-color="#947af2"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#87cefc" stop-opacity=".64"/><stop offset="1" stop-color="#dcecff" stop-opacity="0"/></radialGradient>
 <filter id="shade" x="-70%" y="-70%" width="240%" height="250%"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="shadow" x="-50%" y="-50%" width="220%" height="220%"><feDropShadow dx="1" dy="16" stdDeviation="13" flood-color="#538bcf" flood-opacity=".21"/></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#3f7eb2" flood-opacity=".16"/></filter>
</defs>
