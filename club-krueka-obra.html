<!doctype html><html lang="es-PY"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Creación publicada · Club Krueka</title><link rel="icon" href="logo.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1325;color:#f0f8ff;font:15px/1.45 system-ui,Arial,sans-serif}
header{min-height:59px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 18px;background:#10223d;border-bottom:1px solid #365573}
header a{color:#a4e9f5;text-decoration:none;font-weight:800;white-space:nowrap}header strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .buttons{display:flex;gap:8px;white-space:nowrap}button{background:#203957;border:1px solid #49718c;color:white;border-radius:9px;padding:9px 12px;font:700 12px system-ui;cursor:pointer}
button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){background:#2b5980}
main{height:calc(100dvh - 60px);display:grid;place-items:center;overflow:hidden}
#ck-ob-status{text-align:center;padding:20px;max-width:600px;color:#c4dcef}
#ck-ob-stage{height:100%;width:100%;min-height:0;background:white}
#ck-ob-frame{display:block;width:100%;height:100%;border:0;background:#fff}
#ck-ob-stage:fullscreen{height:100dvh}
@media(max-width:680px){header{min-height:60px;padding:7px;gap:6px}header a,header strong{font-size:11px}button{padding:7px;font-size:10px}main{height:calc(100dvh - 60px)}}
</style></head><body>
<header><a href="club-krueka-galeria.html">← Galería</a><strong id="ck-ob-title">Creación publicada</strong>
<div class="buttons"><button type="button" id="ck-ob-share" disabled>Compartir</button><button type="button" id="ck-ob-full">Pantalla completa</button></div></header>
<main><div id="ck-ob-status" role="status">Abriendo creación aprobada…</div>
<div id="ck-ob-stage" hidden><iframe id="ck-ob-frame" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" title="Obra aprobada del Club Krueka"></iframe></div></main>
<script src="js/club-krueka-obra.js?v=20261114obra1" defer></script>
</body></html>
