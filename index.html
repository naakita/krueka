<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krueka · Plataforma escolar</title>
<link rel="icon" id="favicon" href="logo.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F9F8F7; --panel:#FFFFFF; --line:#E6E5E3; --soft:#F0EFED;
  --tx:#2C2C2B; --tx2:#7D7A75;
  --blue:#2783DE; --blue-bg:#E5F2FC;
  --green:#46A171; --green-bg:#E8F1EC;
  --orange:#D5803B; --orange-bg:#FBEBDE;
  --red:#E56458; --red-bg:#FCE9E7;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1A1A19; --panel:#232322; --line:#34342F; --soft:#2B2B2A; --tx:#F2F1EF; --tx2:#9C9892;
    --blue-bg:#17324B; --green-bg:#193024; --orange-bg:#3A2A18; --red-bg:#3B1F1D; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--tx2);font-size:13px;margin:0 0 14px}
.note{color:var(--tx2);font-size:12px}
.hidden{display:none !important}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-size:24px}
.kpi span{color:var(--tx2);font-size:12px}
label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border:0;border-radius:9px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--soft);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.dan{background:var(--red)}
.btn.ok{background:var(--green)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tag.blue{background:var(--blue-bg);color:var(--blue)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.orange{background:var(--orange-bg);color:var(--orange)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.gray{background:var(--soft);color:var(--tx2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx2);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
.topbar .in{max-width:1080px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{background:#fff;border-radius:10px;padding:6px 10px;display:block}
.logo{width:26px;height:26px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav button{padding:7px 12px;border:0;background:transparent;color:var(--tx2);border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.nav button[aria-selected="true"]{background:var(--blue-bg);color:var(--blue)}
.code{font-size:34px;font-weight:800;letter-spacing:.13em;color:var(--blue)}
.stage{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.stage.on{border-color:var(--green);background:var(--green-bg)}
.pill-list{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:20px;font:inherit;font-size:13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.alert{padding:10px 12px;border-radius:9px;font-size:13px;margin:10px 0}
.alert.err{background:var(--red-bg);color:var(--red)}
.alert.ok{background:var(--green-bg);color:var(--green)}
.alert.info{background:var(--blue-bg);color:var(--blue)}
.center{max-width:430px;margin:8vh auto;padding:0 16px}
.tabs{display:flex;background:var(--soft);border-radius:10px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border:0;background:transparent;color:var(--tx2);border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--tx)}
.hr{height:1px;background:var(--line);margin:14px 0}
.bar{height:7px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.spinner{padding:24px;text-align:center;color:var(--tx2)}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="screen-login" class="center">
  <div style="text-align:center;margin-bottom:18px">
    <img class="marca" src="logo.svg" alt="Krueka — enseñar, aprender, crecer" style="height:104px;margin:0 auto">
    <p class="sub" style="margin-top:10px">Plataforma escolar · gestión de clases</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button id="tab-doc" aria-selected="true" onclick="UI.loginTab('doc')">Docente o dirección</button>
      <button id="tab-alu" aria-selected="false" onclick="UI.loginTab('alu')">Soy alumno</button>
    </div>

    <form id="form-doc" onsubmit="Auth.entrar(event)">
      <div id="err-doc" class="alert err hidden"></div>
      <label for="email">Correo institucional</label>
      <input id="email" type="email" autocomplete="username" placeholder="profe@krueka.edu.py" required>
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <div style="height:14px"></div>
      <button class="btn" style="width:100%;justify-content:center" type="submit">Entrar</button>
    </form>

    <form id="form-alu" class="hidden" onsubmit="Alumno.entrar(event)">
      <div id="err-alu" class="alert err hidden"></div>
      <label for="cod">Código de la clase</label>
      <input id="cod" maxlength="6" style="text-transform:uppercase;text-align:center;font-size:24px;letter-spacing:.2em" placeholder="ABC123" oninput="Alumno.buscar()" required>
      <label for="nom">Tu nombre</label>
      <select id="nom" required><option value="">Primero escribí el código</option></select>
      <div style="height:14px"></div>
      <button class="btn" style="width:100%;justify-content:center" type="submit">Entrar al aula</button>
    </form>
  </div>
  <p class="note" style="text-align:center">Los datos se guardan en la base central de la escuela.</p>
</div>

<!-- ============ PANEL ============ -->
<div id="screen-app" class="hidden">
  <div class="topbar"><div class="in">
    <img class="marca" src="logo.svg" alt="Krueka" style="height:32px">
    <div>
      <div class="note" id="who"></div>
    </div>
    <div class="nav" id="nav"></div>
    <button class="btn sec sm" onclick="Auth.salir()">Salir</button>
  </div></div>
  <div class="wrap" id="view"><div class="spinner">Cargando…</div></div>
</div>

<!-- ============ AULA DEL ALUMNO ============ -->
<div id="screen-alu" class="hidden">
  <div class="topbar"><div class="in">
    <img class="marca" src="logo.svg" alt="Krueka" style="height:32px">
    <div><b>Aula</b><div class="note" id="alu-who"></div></div>
    <button class="btn sec sm" style="margin-left:auto" onclick="location.reload()">Salir</button>
  </div></div>
  <div class="wrap" id="alu-view"></div>
</div>

<script>
const SUPABASE_URL = "https://janebfpnknapvntfqolf.supabase.co";
const SUPABASE_KEY = "sb_publishable_mSuSFqWycvm9dQQzjpeaRA_kAyZOJl0";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ETAPAS = [
  {k:"tema",     t:"Tema y capacidad",       d:"El alumno ve de qué trata la clase"},
  {k:"actividad",t:"Actividad práctica",     d:"Se muestran los pasos a realizar"},
  {k:"entrega",  t:"Entrega del trabajo",    d:"El alumno puede enviar su trabajo"},
  {k:"resultado",t:"Resultados y devolución",d:"El alumno ve su nota y el comentario"}
];

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const hoy = () => new Date().toISOString().slice(0,10);
function aviso(msg, tipo){ const v=$("view"); const d=document.createElement("div"); d.className="alert "+(tipo||"ok"); d.textContent=msg; v.prepend(d); setTimeout(()=>d.remove(), 4000); }

/* estado global */
const St = { user:null, perfil:null, asignaciones:[], csActual:null, planes:[], sesion:null, alumnos:[], tab:null };

/* ==================== AUTENTICACIÓN ==================== */
const Auth = {
  async entrar(e){
    e.preventDefault();
    const err = $("err-doc"); err.classList.add("hidden");
    const { data, error } = await db.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pass").value });
    if(error){ err.textContent = "Correo o contraseña incorrectos."; err.classList.remove("hidden"); return; }
    St.user = data.user;
    await Auth.cargarPerfil();
  },
  async cargarPerfil(){
    const { data:perfil } = await db.from("profiles").select("*").eq("id", St.user.id).single();
    if(!perfil){ alert("Tu usuario no tiene perfil asignado. Avisá al administrador."); return; }
    St.perfil = perfil;
    db.from("profiles").update({ ultimo_acceso:new Date().toISOString() }).eq("id", St.user.id).then(()=>{});
    $("screen-login").classList.add("hidden");
    $("screen-app").classList.remove("hidden");
    const rol = {admin:"Administrador", director:"Dirección", docente:"Docente", alumno:"Alumno"}[perfil.role];
    $("who").textContent = perfil.nombre + " · " + rol;
    UI.construirNav();
  },
  async salir(){ await db.auth.signOut(); location.reload(); }
};

/* ==================== NAVEGACIÓN ==================== */
const UI = {
  loginTab(w){
    $("tab-doc").setAttribute("aria-selected", w==="doc");
    $("tab-alu").setAttribute("aria-selected", w==="alu");
    $("form-doc").classList.toggle("hidden", w!=="doc");
    $("form-alu").classList.toggle("hidden", w!=="alu");
  },
  menus(){
    const r = St.perfil.role;
    if(r==="docente") return [["clase","Clase de hoy"],["planificacion","Planificación"],["alumnos","Alumnos"],["entregas","Entregas"],["conducta","Registro anecdótico"],["miscursos","Mis cursos"]];
    if(r==="director") return [["control","Control docente"],["resumen","Alumnos"],["planes","Planificaciones"]];
    if(r==="admin")   return [["control","Control docente"],["usuarios","Usuarios y roles"],["estructura","Cursos y materias"]];
    return [["control","Panel"]];
  },
  construirNav(){
    const m = UI.menus();
    $("nav").innerHTML = m.map(([k,t])=>`<button data-k="${k}" onclick="UI.ir('${k}')">${t}</button>`).join("");
    UI.ir(m[0][0]);
  },
  ir(k){
    St.tab = k;
    document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.k===k));
    $("view").innerHTML = '<div class="spinner">Cargando…</div>';
    ({ clase:Docente.vClase, planificacion:Docente.vPlanificacion, alumnos:Docente.vAlumnos, miscursos:Docente.vMisCursos,
       entregas:Docente.vEntregas, conducta:Docente.vConducta,
       control:Direccion.vControl, resumen:Direccion.vAlumnos, planes:Direccion.vPlanes,
       usuarios:Admin.vUsuarios, estructura:Admin.vEstructura })[k]();
  }
};

/* ==================== DATOS COMPARTIDOS ==================== */
async function cargarAsignaciones(){
  let q = db.from("course_subjects").select("id, horas_semanales, teacher_id, courses(id,nombre), subjects(id,nombre)");
  if(St.perfil.role === "docente") q = q.eq("teacher_id", St.perfil.id);
  const { data } = await q;
  St.asignaciones = data || [];
  if(!St.csActual && St.asignaciones.length) St.csActual = St.asignaciones[0].id;
  return St.asignaciones;
}
function selectorCurso(onchange){
  return `<label>Curso y materia</label><select onchange="${onchange}">` +
    St.asignaciones.map(a=>`<option value="${a.id}" ${a.id===St.csActual?"selected":""}>${esc(a.courses.nombre)} · ${esc(a.subjects.nombre)}</option>`).join("") +
    `</select>`;
}
async function cargarAlumnos(courseId){
  const { data } = await db.from("enrollments").select("id, numero_lista, students(id,nombre)").eq("course_id", courseId).eq("activo", true);
  St.alumnos = (data||[]).map(e=>({ id:e.students.id, nombre:e.students.nombre })).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return St.alumnos;
}
function asignacionActual(){ return St.asignaciones.find(a=>a.id===St.csActual); }

/* ==================== PANEL DOCENTE ==================== */
const Docente = {
  async cambiarCurso(id){ St.csActual = id; UI.ir(St.tab); },

  async vClase(){
    await cargarAsignaciones();
    const a = asignacionActual();
    if(!a){ $("view").innerHTML = '<div class="card"><h2>Todavía no tenés cursos asignados</h2><p class="sub">Pedile a dirección que te asigne un curso y una materia.</p></div>'; return; }
    const [{data:planes}, {data:ses}] = await Promise.all([
      db.from("lesson_plans").select("*").eq("course_subject_id", a.id).order("numero"),
      db.from("class_sessions").select("*").eq("course_subject_id", a.id).eq("abierta", true).maybeSingle()
    ]);
    St.planes = planes || []; St.sesion = ses || null;
    await cargarAlumnos(a.courses.id);
    const plan = St.sesion ? St.planes.find(p=>p.id===St.sesion.lesson_plan_id) : St.planes[0];
    const et = (St.sesion && St.sesion.etapas) || {};
    let asis = {};
    if(St.sesion){
      const { data:att } = await db.from("attendance").select("student_id, estado").eq("session_id", St.sesion.id);
      (att||[]).forEach(r=>asis[r.student_id]=r.estado);
    }
    const presentes = Object.values(asis).filter(v=>v==="presente").length;

    $("view").innerHTML = `
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div style="flex:1;min-width:260px">
            <span class="tag blue">${esc(a.courses.nombre)} · ${esc(a.subjects.nombre)}</span>
            <h1 style="margin-top:10px">${plan ? "Clase "+(plan.numero||"")+" · "+esc(plan.titulo) : "Sin planificación cargada"}</h1>
            <p class="sub" style="margin:0">${plan ? esc(plan.unidad||"")+" · "+plan.duracion_min+" minutos" : "Cargá una en la pestaña Planificación"}</p>
          </div>
          <div style="text-align:right">
            <div class="note">Código para los alumnos</div>
            <div class="code">${St.sesion ? esc(St.sesion.codigo) : "— — — —"}</div>
            <button class="btn sm" onclick="Docente.abrirClase()">${St.sesion ? "Abrir otra clase" : "Abrir la clase"}</button>
          </div>
        </div>
        <div class="hr"></div>
        <label>Clase a desarrollar</label>
        <div class="pill-list">${St.planes.map(p=>`<button class="pill" aria-pressed="${plan&&p.id===plan.id}" onclick="Docente.elegirPlan('${p.id}')">Clase ${p.numero||""}</button>`).join("") || '<span class="note">Sin planificaciones</span>'}</div>
      </div>

      <div class="grid3">
        <div class="kpi"><b>${St.alumnos.length}</b><span>Alumnos en la lista</span></div>
        <div class="kpi"><b>${presentes}</b><span>Presentes hoy</span></div>
        <div class="kpi"><b>${Object.keys(et).filter(k=>et[k]).length}/4</b><span>Etapas liberadas</span></div>
      </div>

      ${plan ? `<div class="card"><h2>Desarrollo de la clase</h2>
        <p><b>Capacidad:</b> ${esc(plan.capacidad||"—")}</p>
        <p><b>Inicio (8 min):</b> ${esc(plan.inicio||"—")}</p>
        <p><b>Desarrollo (40 min):</b> ${esc(plan.desarrollo||"—")}</p>
        <p><b>Cierre (12 min):</b> ${esc(plan.cierre||"—")}</p>
        <div class="alert info" style="margin-bottom:0"><b>Plan B:</b> ${esc(plan.plan_b||"—")}</div>
      </div>` : ""}

      <div class="card">
        <h2>Liberar por etapas</h2>
        <p class="sub">Los alumnos solo ven lo que vos habilitás.</p>
        ${ETAPAS.map(e=>`<div class="stage ${et[e.k]?"on":""}">
            <div style="flex:1"><b>${e.t}</b><div class="note">${e.d}</div></div>
            <button class="btn sm ${et[e.k]?"sec":"ok"}" ${St.sesion?"":"disabled"} onclick="Docente.etapa('${e.k}')">${et[e.k]?"Ocultar":"Liberar"}</button>
          </div>`).join("")}
        ${St.sesion?"":'<p class="note">Abrí la clase para poder liberar las etapas.</p>'}
      </div>

      <div class="card">
        <h2>Asistencia</h2>
        ${!St.sesion ? '<p class="note">Abrí la clase para tomar asistencia.</p>' :
          (St.alumnos.length ? `<table><tbody>${St.alumnos.map(al=>`<tr><td>${esc(al.nombre)}</td><td style="text-align:right">
            ${[["presente","Presente"],["tarde","Tarde"],["ausente","Ausente"],["justificado","Justificado"]].map(([v,t])=>
              `<button class="pill" aria-pressed="${asis[al.id]===v}" onclick="Docente.asistencia('${al.id}','${v}')">${t}</button>`).join(" ")}
          </td></tr>`).join("")}</tbody></table>` : '<p class="note">Cargá la lista en la pestaña Alumnos.</p>')}
      </div>`;
  },

  async elegirPlan(id){
    if(!St.sesion){ St.planes.sort((a,b)=>(a.id===id?-1:1)); await Docente.abrirClase(id); return; }
    await db.from("class_sessions").update({ lesson_plan_id:id, etapas:{} }).eq("id", St.sesion.id);
    UI.ir("clase");
  },
  async abrirClase(planId){
    const plan = planId || (St.sesion ? St.sesion.lesson_plan_id : (St.planes[0] && St.planes[0].id));
    if(!plan){ alert("Primero cargá una planificación."); return; }
    const { error } = await db.rpc("abrir_clase", { p_course_subject_id:St.csActual, p_lesson_plan_id:plan });
    if(error){ alert("No se pudo abrir la clase: "+error.message); return; }
    UI.ir("clase");
  },
  async etapa(k){
    const et = Object.assign({}, St.sesion.etapas||{});
    et[k] = !et[k];
    await db.from("class_sessions").update({ etapas:et }).eq("id", St.sesion.id);
    UI.ir("clase");
  },
  async asistencia(studentId, estado){
    await db.from("attendance").upsert({ session_id:St.sesion.id, student_id:studentId, estado, registrado_por:St.perfil.id }, { onConflict:"session_id,student_id" });
    UI.ir("clase");
  },

  /* ---------- planificación ---------- */
  async vPlanificacion(){
    await cargarAsignaciones();
    const a = asignacionActual();
    if(!a){ $("view").innerHTML='<div class="card"><p class="sub">Sin cursos asignados.</p></div>'; return; }
    const { data:planes } = await db.from("lesson_plans").select("*, lesson_indicators(id,descripcion,puntaje_max,orden)").eq("course_subject_id", a.id).order("numero");
    $("view").innerHTML = `
      <div class="card">${selectorCurso("Docente.cambiarCurso(this.value)")}</div>
      <div class="card">
        <h2>Cargar una clase nueva</h2>
        <p class="sub">Preparala con anticipación: el día de la clase ya te aparece lista para dictar.</p>
        <div class="grid2">
          <div><label>Número</label><input id="p-num" type="number" min="1" value="${(planes||[]).length+1}"></div>
          <div><label>Fecha prevista</label><input id="p-fecha" type="date" value="${hoy()}"></div>
        </div>
        <label>Título de la clase</label><input id="p-tit" placeholder="Ej.: Hoja de cálculo y gráficos">
        <label>Unidad</label><input id="p-uni">
        <label>Capacidad del programa</label><textarea id="p-cap"></textarea>
        <div class="grid2">
          <div><label>Inicio (8 min)</label><textarea id="p-ini"></textarea></div>
          <div><label>Desarrollo (40 min)</label><textarea id="p-des"></textarea></div>
          <div><label>Cierre (12 min)</label><textarea id="p-cie"></textarea></div>
          <div><label>Plan B sin internet o sin electricidad</label><textarea id="p-pb"></textarea></div>
        </div>
        <div class="hr"></div>
        <h3>Actividad del alumno</h3>
        <div class="grid2">
          <div><label>Título</label><input id="p-atit"></div>
          <div><label>Nombre del archivo a entregar</label><input id="p-arch" placeholder="Tema_Nombre"></div>
        </div>
        <label>Objetivo</label><input id="p-aobj">
        <label>Pasos (uno por línea)</label><textarea id="p-pasos"></textarea>
        <label>Preguntas de cierre (una por línea)</label><textarea id="p-preg"></textarea>
        <div class="hr"></div>
        <h3>Indicadores y puntajes</h3>

          <td><span class="tag ${p.estado==="dictada"?"green":p.estado==="borrador"?"gray":"blue"}">${p.estado}</span></td>

  async guardarPlan(){
    const val = id => $(id).value.trim();
    if(!val("p-tit")){ alert("Poné al menos el título de la clase."); return; }
    const lineas = t => t.split("\n").map(s=>s.trim()).filter(Boolean);
    const { data:plan, error } = await db.from("lesson_plans").insert({
      course_subject_id: St.csActual,
      numero: Number(val("p-num"))||null,
      titulo: val("p-tit"), unidad: val("p-uni"), capacidad: val("p-cap"),
      fecha_prevista: val("p-fecha")||null, duracion_min:60,
      inicio: val("p-ini"), desarrollo: val("p-des"), cierre: val("p-cie"), plan_b: val("p-pb"),
      actividad_titulo: val("p-atit"), actividad_objetivo: val("p-aobj"), actividad_archivo: val("p-arch"),
      actividad_pasos: lineas($("p-pasos").value), actividad_preguntas: lineas($("p-preg").value),
      estado: "planificada", created_by: St.perfil.id
    }).select().single();
    if(error){ alert("No se pudo guardar: "+error.message); return; }
    const inds = lineas($("p-ind").value).map((l,i)=>{
      const p = l.split(";");
      return { lesson_plan_id:plan.id, descripcion:p[0].trim(), puntaje_max:Number((p[1]||"20").trim())||20, orden:i+1 };
    });
    if(inds.length) await db.from("lesson_indicators").insert(inds);
    UI.ir("planificacion"); aviso("Planificación guardada.");
  },
  async borrarPlan(id){
    if(!confirm("¿Borrar esta planificación?")) return;
    await db.from("lesson_plans").delete().eq("id", id);
    UI.ir("planificacion");
  },

      <div class="card">
        <h2>Asignaciones actuales</h2>
        <p class="sub">Cambiá el docente o las horas, o borrá la asignación si ese grado ya no se dicta.</p>
        <table><thead><tr><th>Curso</th><th>Materia</th><th>Docente</th><th>Horas</th><th></th></tr></thead><tbody>
        ${(asigs||[]).map(a=>`<tr>
          <td><b>${esc(a.courses.nombre)}</b></td>
          <td>${esc(a.subjects.nombre)}</td>
          <td><select onchange="Admin.cambiarDocente('${a.id}', this.value)">
            <option value="">Sin asignar</option>
            ${(docentes||[]).map(d=>`<option value="${d.id}" ${a.teacher_id===d.id?"selected":""}>${esc(d.nombre)}</option>`).join("")}
          </select></td>
          <td style="width:92px"><input type="number" step="0.5" value="${a.horas_semanales==null?"":a.horas_semanales}" onchange="Admin.cambiarHoras('${a.id}', this.value)"></td>
          <td style="text-align:right"><button class="btn sec sm" onclick="Admin.borrarAsignacion('${a.id}')">Borrar</button></td>
        </tr>`).join("") || '<tr><td colspan="5" class="note">Sin asignaciones.</td></tr>'}
        </tbody></table>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>Cursos cargados</h2>
          <table><tbody>${(cursos||[]).map(c=>`<tr><td>${esc(c.nombre)}</td>
            <td style="text-align:right">
              <button class="btn sec sm" onclick="Admin.renombrarCurso('${c.id}')">Renombrar</button>
              <button class="btn dan sm" onclick="Admin.borrarCurso('${c.id}')">Eliminar</button>
            </td></tr>`).join("") || '<tr><td class="note">Sin cursos.</td></tr>'}</tbody></table>
          <p class="note" style="margin-top:8px">Al eliminar un curso se borran también sus materias asignadas, sus clases y su lista de alumnos.</p>
        </div>
        <div class="card">
          <h2>Materias cargadas</h2>
          <table><tbody>${(materias||[]).map(m=>`<tr><td>${esc(m.nombre)}</td>
            <td style="text-align:right">
              <button class="btn sec sm" onclick="Admin.renombrarMateria('${m.id}')">Renombrar</button>
              <button class="btn dan sm" onclick="Admin.borrarMateria('${m.id}')">Eliminar</button>
            </td></tr>`).join("") || '<tr><td class="note">Sin materias.</td></tr>'}</tbody></table>
        </div>
      </div>`;
  },
  async cambiarDocente(id, teacherId){
    const { error } = await db.from("course_subjects").update({ teacher_id: teacherId || null }).eq("id", id);
    if(error){ alert("No se pudo cambiar: "+error.message); return; }
    aviso("Docente actualizado.");
  },
  async cambiarHoras(id, v){
    await db.from("course_subjects").update({ horas_semanales: v==="" ? null : Number(v) }).eq("id", id);
    aviso("Horas actualizadas.");
  },
  async borrarAsignacion(id){
    if(!confirm("¿Borrar esta asignación? Se eliminan también sus planificaciones y sus clases.")) return;
    const { error } = await db.from("course_subjects").delete().eq("id", id);
    if(error){ alert("No se pudo borrar: "+error.message); return; }
    UI.ir("estructura");
  },
  async renombrarCurso(id){
    const n = prompt("Nuevo nombre del curso:"); if(!n || !n.trim()) return;
    const { error } = await db.from("courses").update({ nombre:n.trim() }).eq("id", id);
    if(error){ alert("No se pudo renombrar: "+error.message); return; }
    UI.ir("estructura");
  },
  async borrarCurso(id){
    if(!confirm("¿Eliminar el curso con todas sus materias, clases y alumnos inscriptos?")) return;
    const { error } = await db.from("courses").delete().eq("id", id);
    if(error){ alert("No se pudo eliminar: "+error.message); return; }
    UI.ir("estructura");
  },
  async renombrarMateria(id){
    const n = prompt("Nuevo nombre de la materia:"); if(!n || !n.trim()) return;
    const { error } = await db.from("subjects").update({ nombre:n.trim() }).eq("id", id);
    if(error){ alert("No se pudo renombrar: "+error.message); return; }
    UI.ir("estructura");
  },
  async borrarMateria(id){
    if(!confirm("¿Eliminar la materia y todas sus asignaciones?")) return;
    const { error } = await db.from("subjects").delete().eq("id", id);
    if(error){ alert("No se pudo eliminar: "+error.message); return; }
    UI.ir("estructura");
  },
  async nuevoCurso(){
    const { error } = await db.from("courses").insert({ institution_id:St.perfil.institution_id, nombre:$("c-nom").value.trim(), grado:$("c-gra").value.trim(), seccion:$("c-sec").value.trim() });
    if(error){ alert(error.message); return; } UI.ir("estructura");
  },
  async nuevaMateria(){
    const { error } = await db.from("subjects").insert({ institution_id:St.perfil.institution_id, nombre:$("m-nom").value.trim(), area:$("m-area").value.trim() });
    if(error){ alert(error.message); return; } UI.ir("estructura");
  },
  async asignar(){
    const { error } = await db.from("course_subjects").insert({ course_id:$("a-cur").value, subject_id:$("a-mat").value, teacher_id:$("a-doc").value, horas_semanales:Number($("a-hs").value)||null });
    if(error){ alert(error.message); return; } UI.ir("estructura");
  }
};

/* ==================== AULA DEL ALUMNO ==================== */
const Alumno = { aula:null, codigo:"", yo:null,
  async buscar(){
    const cod = $("cod").value.trim().toUpperCase();
    const sel = $("nom");
    if(cod.length < 6){ sel.innerHTML = '<option value="">Primero escribí el código</option>'; return; }
    const { data, error } = await db.rpc("aula_por_codigo", { p_codigo:cod });
    if(error || !data){ sel.innerHTML = '<option value="">Código no encontrado</option>'; return; }
    Alumno.aula = data; Alumno.codigo = cod;
    sel.innerHTML = '<option value="">Elegí tu nombre</option>' + (data.alumnos||[]).map(a=>`<option value="${a.id}">${esc(a.nombre)}</option>`).join("");
  },
  async entrar(e){
    e.preventDefault();
    const err = $("err-alu"); err.classList.add("hidden");
    if(!Alumno.aula){ err.textContent = "Ese código no corresponde a ninguna clase abierta."; err.classList.remove("hidden"); return; }
    if(!$("nom").value){ err.textContent = "Elegí tu nombre en la lista."; err.classList.remove("hidden"); return; }
    Alumno.yo = { id:$("nom").value, nombre:$("nom").selectedOptions[0].textContent };
    $("screen-login").classList.add("hidden");
    $("screen-alu").classList.remove("hidden");
    $("alu-who").textContent = Alumno.yo.nombre + " · " + Alumno.aula.curso;
    Alumno.render();
    setInterval(Alumno.refrescar, 15000);
  },
  async refrescar(){
    const { data } = await db.rpc("aula_por_codigo", { p_codigo:Alumno.codigo });
    if(data){ Alumno.aula = data; Alumno.render(); }
  },
  async render(){
    const a = Alumno.aula, et = a.etapas||{}, cl = a.clase||{};
    const res = await db.rpc("mi_resultado", { p_codigo:Alumno.codigo, p_student_id:Alumno.yo.id });
    const r = res.data || {};
    $("alu-view").innerHTML = `
      ${et.tema ? `<div class="card">
        <span class="tag blue">${esc(a.materia)}</span>
        <h1 style="margin-top:10px">${esc(cl.titulo||"")}</h1>
        <p class="sub">${esc(cl.unidad||"")}</p>
        <p><b>Lo que vamos a lograr:</b> ${esc(cl.capacidad||"")}</p>
      </div>` : '<div class="card"><h2>Esperá al profesor</h2><p class="sub">En unos momentos se habilita el tema de la clase.</p></div>'}

      ${et.actividad ? `<div class="card">
        <h2>${esc(cl.actividad_titulo||"Actividad")}</h2>
        <p class="sub">${esc(cl.actividad_objetivo||"")}</p>
        <ol>${(cl.pasos||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
        ${cl.actividad_archivo?`<div class="alert info">Guardá tu archivo con el nombre <b>${esc(cl.actividad_archivo)}</b></div>`:""}
      </div>` : ""}

      ${et.entrega ? `<div class="card">
        <h2>Entregar mi trabajo</h2>
        ${r.entregado?'<div class="alert ok">Ya enviaste tu trabajo. Podés corregirlo y volver a enviar.</div>':""}
        ${(cl.preguntas||[]).map((p,i)=>`<label>${esc(p)}</label><textarea id="q${i}"></textarea>`).join("")}
        <label>Nombre del archivo que guardaste</label><input id="e-arch" value="${esc(cl.actividad_archivo||"")}">
        <label>Enlace (opcional)</label><input id="e-link" placeholder="Si subiste el trabajo a la nube">
        <label>Compañeros de equipo (opcional)</label><input id="e-eq">
        <label>Comentario para el profesor (opcional)</label><input id="e-com">
        <div style="height:12px"></div>
        <button class="btn" onclick="Alumno.entregar(${(cl.preguntas||[]).length})">Enviar mi trabajo</button>
      </div>` : ""}

      ${et.resultado ? `<div class="card">
        <h2>Mi resultado</h2>
        ${r.nota!=null ? `<div class="code" style="font-size:44px">${r.nota}</div><p><b>Devolución:</b> ${esc(r.devolucion||"—")}</p>`
          : '<p class="sub">El profesor todavía no corrigió tu trabajo.</p>'}
      </div>` : ""}`;
  },
  async entregar(nPreg){
    const respuestas = [];
    for(let i=0;i<nPreg;i++) respuestas.push($("q"+i).value.trim());
    const { error } = await db.rpc("entregar_trabajo", {
      p_codigo:Alumno.codigo, p_student_id:Alumno.yo.id, p_respuestas:respuestas,
      p_archivo:$("e-arch").value.trim(), p_enlace:$("e-link").value.trim(),
      p_equipo:$("e-eq").value.trim(), p_comentario:$("e-com").value.trim()
    });
    if(error){ alert("No se pudo enviar: "+error.message); return; }
    Alumno.render();
    alert("Trabajo enviado. Ya le llegó al profesor.");
  }
};
